name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to move the "latest" tag and update its release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle + dependencies and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v4

      # ---- Rust core -------------------------------------------------------
      - name: Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: Test syscore
        run: cargo test --manifest-path syscore/Cargo.toml

      # The SDK is preinstalled on ubuntu-latest (ANDROID_HOME); pin the NDK so
      # the .so doesn't change with whatever NDK the runner image ships.
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cross-compile syscore (arm64-v8a, armeabi-v7a)
        working-directory: syscore
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --release

      # ---- Android app -----------------------------------------------------
      # AGP fetches platform 34 / build-tools on its own if they're missing.
      - name: Build debug APK, run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --console=plain

      - name: Check the APK carries the native lib
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk.txt | grep -E 'lib/(arm64-v8a|armeabi-v7a)/libsyscore.so'
          test "$(grep -c 'libsyscore.so' /tmp/apk.txt)" -eq 2

      - uses: actions/upload-artifact@v4
        with:
          name: tvmon-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # Rolling public download: https://github.com/<owner>/<repo>/releases/latest/download/tvmon.apk
      # The app has no INTERNET permission, so it never fetches this itself;
      # users update by hand (see README).
      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tvmon.apk
          git tag -f latest
          git push -f origin refs/tags/latest
          notes="Debug build of ${GITHUB_SHA::7} from main, $(date -u +%F). Replaced automatically on every push to main."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest build" --notes "$notes" --latest
            gh release upload latest tvmon.apk --clobber
          else
            gh release create latest tvmon.apk --title "Latest build" --notes "$notes" --latest
          fi

      # Build metadata next to the APK (same format as the sibling apps), so a
      # script or a person can tell which commit the APK is and check its sha256.
      # Uploaded after the APK, so it never describes an APK that isn't there yet.
      - name: Publish version.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '{"sha":"%s","time":%s,"apk":"tvmon.apk","sha256":"%s","size":%s}\n' \
            "$GITHUB_SHA" "$(git log -1 --format=%ct)" \
            "$(sha256sum tvmon.apk | cut -d' ' -f1)" "$(stat -c%s tvmon.apk)" > version.json
          cat version.json
          gh release upload latest version.json --clobber
