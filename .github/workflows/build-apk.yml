name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Only this branch publishes the debug-latest release that installed apps
# self-update from; other branches and PRs just build and test.
env:
  PUBLISH_BRANCH: phrag/lucid-davinci-08spjq

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('syscore/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build syscore native libs
        working-directory: syscore
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o ../app/src/main/jniLibs build --release

      - name: Run syscore tests
        run: cargo test --manifest-path syscore/Cargo.toml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/tvmon.apk

      # Published as a raw Release asset (not a zip) at a fixed, rolling tag
      # so there's always one stable "latest debug build" download link.
      - name: Publish debug APK as a release asset
        if: github.event_name == 'push' && github.ref_name == env.PUBLISH_BRANCH
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: tvmon debug build (latest)
          body: |
            Automatically rebuilt from ${{ github.sha }} on branch `${{ github.ref_name }}`.
            Not a tagged release — this asset is overwritten on every push.
          prerelease: true
          files: app/build/outputs/apk/debug/tvmon.apk

      # Self-updater metadata (Updater.kt). Published after the APK, so it never
      # describes an APK that isn't there yet; the app also checks the sha256.
      - name: Write version.json
        if: github.event_name == 'push' && github.ref_name == env.PUBLISH_BRANCH
        run: |
          apk=app/build/outputs/apk/debug/tvmon.apk
          printf '{"sha":"%s","time":%s,"apk":"tvmon.apk","sha256":"%s","size":%s}\n' \
            "$GITHUB_SHA" "$(git log -1 --format=%ct)" \
            "$(sha256sum "$apk" | cut -d' ' -f1)" "$(stat -c%s "$apk")" > version.json
          cat version.json

      - name: Publish version.json
        if: github.event_name == 'push' && github.ref_name == env.PUBLISH_BRANCH
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: tvmon debug build (latest)
          body: |
            Automatically rebuilt from ${{ github.sha }} on branch `${{ github.ref_name }}`.
            Not a tagged release — this asset is overwritten on every push.
          prerelease: true
          files: version.json
