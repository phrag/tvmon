[package]
name = "syscore"
version = "0.1.0"
edition = "2021"
description = "Unprivileged /proc + /sys reader for tvmon (no root, no Shizuku)"
license = "GPL-3.0-only"

[lib]
name = "syscore"
# cdylib -> the .so loaded by Android via JNI; rlib -> host unit tests
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# jni is only needed when building for Android; keep it off the host test build.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Small .so: it's loaded on every overlay start. Abort rather than unwind, since
# a panic must never unwind across the JNI boundary into the JVM.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
